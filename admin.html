<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAJU | Simple Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#18202a}.top{background:#111827;color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:23px}.top a{color:#fff}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:0;background:#e5e7eb;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer}.tab.active{background:#111827;color:#fff}.panel{display:none}.panel.active{display:block}.bar,.card{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:17px;margin-bottom:15px}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.success{background:#168b45;color:#fff}.fields{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.fields input,.fields textarea,.fields select{width:100%;padding:10px;border:1px solid #d4d9df;border-radius:8px;font:inherit}.fields textarea{grid-column:1/-1}.product{display:grid;grid-template-columns:100px 1fr;gap:16px}.thumb{width:100px;height:100px;background:#eef0f3;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#777;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:18px}.stat b{font-size:25px;display:block;margin-top:5px}.order{border:1px solid #e1e5ea;border-radius:10px;padding:15px;margin-bottom:10px;background:#fff}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.small{font-size:12px;color:#6b7280}.notice{background:#fff8df;border:1px solid #ead48a;padding:13px;border-radius:9px;margin-bottom:15px;line-height:1.5}.login{max-width:400px;margin:12vh auto;padding:25px;background:#fff;border:1px solid #ddd;border-radius:14px}.login input{width:100%;padding:12px;margin:8px 0 12px;border:1px solid #ddd;border-radius:8px}.error{color:#b91c1c;font-size:13px}
@media(max-width:700px){.fields{grid-template-columns:1fr}.product{grid-template-columns:1fr}.thumb{width:100%;height:180px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView" class="login">
<h2>MAJU Admin</h2><p>Enter your dashboard PIN.</p>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN">
<button class="btn primary" style="width:100%" onclick="login()">Open Dashboard</button>
<p id="loginError" class="error"></p>
<p class="small">Default PIN for this local version: <b>1234</b>. Change it in Settings.</p>
</div>

<div id="app" style="display:none">
<div class="top"><h1>MAJU Dashboard</h1><div><a href="index.html">View Store</a> &nbsp; | &nbsp; <a href="#" onclick="logout()">Logout</a></div></div>
<div class="wrap">
<div class="tabs">
<button class="tab active" onclick="showTab('products',this)">Products</button>
<button class="tab" onclick="showTab('orders',this)">Orders</button>
<button class="tab" onclick="showTab('settings',this)">Settings</button>
</div>

<section id="products" class="panel active">
<div class="bar"><button class="btn primary" onclick="addProduct()">＋ Add Product</button><button class="btn" onclick="resetProducts()">Reset Demo Products</button><span id="status" class="small"></span></div>
<div id="productList"></div>
</section>

<section id="orders" class="panel">
<div class="stats" id="stats"></div>
<div class="bar"><button class="btn danger" onclick="clearOrders()">Clear All Orders</button></div>
<div id="orderList"></div>
</section>

<section id="settings" class="panel">
<div class="notice"><b>Simple setup:</b> Enter your WhatsApp number in international format without + or spaces. Example: 27821234567.</div>
<div class="card">
<div class="fields" style="grid-template-columns:1fr 1fr">
<label>Store name<input id="storeName"></label>
<label>WhatsApp number<input id="whatsapp"></label>
<label>Store tagline<input id="tagline"></label>
<label>New dashboard PIN<input id="newPin" type="password" placeholder="Leave empty to keep current PIN"></label>
</div>
<div class="actions"><button class="btn primary" onclick="saveSettingsForm()">Save Settings</button><span id="settingStatus" class="small"></span></div>
</div>
</section>
</div>
</div>

<script>
const DEFAULT_SETTINGS = {storeName:"MAJU",whatsapp:"27820000000",currency:"R",tagline:"Online Style & Tech Hub"};
const DEFAULT_PRODUCTS = [
{id:1,name:"Classic MAJU T-Shirt",category:"Clothing",price:299,stock:10,description:"Comfortable everyday T-shirt.",image:""},
{id:2,name:"Premium Hoodie",category:"Clothing",price:599,stock:8,description:"Modern hoodie for everyday wear.",image:""},
{id:3,name:"Wireless Headphones",category:"Electronics",price:899,stock:6,description:"Wireless audio for work and travel.",image:""},
{id:4,name:"Smart Watch",category:"Electronics",price:1299,stock:5,description:"Modern smartwatch with useful features.",image:""},
{id:5,name:"Everyday Backpack",category:"Accessories",price:449,stock:9,description:"Practical backpack for daily use.",image:""},
{id:6,name:"Classic Sunglasses",category:"Accessories",price:249,stock:12,description:"Simple and stylish everyday sunglasses.",image:""}];
function getProducts(){try{const s=localStorage.getItem("maju_products");if(s)return JSON.parse(s)}catch(e){} localStorage.setItem("maju_products",JSON.stringify(DEFAULT_PRODUCTS));return DEFAULT_PRODUCTS}
function saveProducts(p){localStorage.setItem("maju_products",JSON.stringify(p))}
function getSettings(){try{return {...DEFAULT_SETTINGS,...(JSON.parse(localStorage.getItem("maju_settings"))||{})}}catch(e){return {...DEFAULT_SETTINGS}}}
function saveSettings(s){localStorage.setItem("maju_settings",JSON.stringify(s))}
function getOrders(){try{return JSON.parse(localStorage.getItem("maju_orders"))||[]}catch(e){return []}}
function money(n){return Number(n||0).toLocaleString("en-ZA",{minimumFractionDigits:0,maximumFractionDigits:2})}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script>
<script>
let products=getProducts(), settings=getSettings(), orders=getOrders();
const PIN_KEY="maju_admin_pin";
function getPin(){return localStorage.getItem(PIN_KEY)||"1234"}
function login(){
 if(document.getElementById("pin").value===getPin()){sessionStorage.setItem("maju_admin_login","1");openApp()}
 else document.getElementById("loginError").textContent="Incorrect PIN.";
}
function openApp(){document.getElementById("loginView").style.display="none";document.getElementById("app").style.display="block";drawProducts();drawOrders();fillSettings()}
function logout(){sessionStorage.removeItem("maju_admin_login");location.reload()}
if(sessionStorage.getItem("maju_admin_login")==="1")openApp();

function showTab(id,btn){
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");btn.classList.add("active");
 if(id==="orders")drawOrders();
}
function drawProducts(){
 document.getElementById("productList").innerHTML=products.map((p,i)=>`
 <div class="card product"><div class="thumb">${p.image?`<img src="${p.image}" alt="">`:"PHOTO"}</div>
 <div><div class="fields">
 <input value="${esc(p.name)}" placeholder="Product name" oninput="products[${i}].name=this.value">
 <input type="number" min="0" value="${p.price}" placeholder="Price" oninput="products[${i}].price=Number(this.value)">
 <select onchange="products[${i}].category=this.value">
 ${["Clothing","Electronics","Accessories","Other"].map(c=>`<option ${p.category===c?"selected":""}>${c}</option>`).join("")}</select>
 <input type="number" min="0" value="${p.stock||0}" placeholder="Stock" oninput="products[${i}].stock=Number(this.value)">
 <textarea rows="2" placeholder="Description" oninput="products[${i}].description=this.value">${esc(p.description)}</textarea>
 </div>
 <div class="actions">
 <label class="btn" style="background:#eef2ff">📷 Change Picture<input type="file" accept="image/*" hidden onchange="readImage(event,${i})"></label>
 <button class="btn primary" onclick="saveOne(${i})">Save Product</button>
 <button class="btn danger" onclick="deleteProduct(${i})">Delete</button>
 </div></div></div>`).join("");
}
function saveOne(i){saveProducts(products);setStatus("Saved: "+products[i].name)}
function addProduct(){products.push({id:Date.now(),name:"New Product",category:"Other",price:0,stock:1,description:"Add a description.",image:""});saveProducts(products);drawProducts();setStatus("New product added")}
function deleteProduct(i){if(confirm("Delete this product?")){products.splice(i,1);saveProducts(products);drawProducts();setStatus("Product deleted")}}
function readImage(e,i){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){alert("Please choose an image under 2 MB.");return}const r=new FileReader();r.onload=()=>{products[i].image=r.result;saveProducts(products);drawProducts();setStatus("Picture updated")};r.readAsDataURL(f)}
function resetProducts(){if(confirm("Reset products to demo products?")){localStorage.removeItem("maju_products");products=getProducts();drawProducts();setStatus("Demo products restored")}}
function setStatus(t){document.getElementById("status").textContent="✓ "+t;setTimeout(()=>document.getElementById("status").textContent="",2000)}
function drawOrders(){
 orders=getOrders();
 const total=orders.reduce((a,o)=>a+Number(o.total||0),0);
 document.getElementById("stats").innerHTML=`<div class="stat">Orders<b>${orders.length}</b></div><div class="stat">Order Value<b>R${money(total)}</b></div><div class="stat">New Orders<b>${orders.filter(o=>o.status==="New").length}</b></div>`;
 document.getElementById("orderList").innerHTML=orders.length?orders.map((o,i)=>`<div class="order"><div class="order-head"><b>Order #${o.id}</b><span class="small">${esc(o.date)} · ${esc(o.status||"New")}</span></div><p>${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty} — R${money(x.price*x.qty)}`).join("<br>")}</p><b>Total: R${money(o.total)}</b></div>`).join(""):"No orders yet. Orders created through WhatsApp checkout will appear here.";
}
function clearOrders(){if(confirm("Delete all saved orders from this browser?")){localStorage.removeItem("maju_orders");orders=[];drawOrders()}}
function fillSettings(){document.getElementById("storeName").value=settings.storeName;document.getElementById("whatsapp").value=settings.whatsapp;document.getElementById("tagline").value=settings.tagline}
function saveSettingsForm(){
 settings={...settings,storeName:document.getElementById("storeName").value||"MAJU",whatsapp:document.getElementById("whatsapp").value.replace(/\D/g,""),tagline:document.getElementById("tagline").value||"Online Style & Tech Hub"};
 saveSettings(settings);
 const pin=document.getElementById("newPin").value.trim();if(pin)localStorage.setItem(PIN_KEY,pin);
 document.getElementById("newPin").value="";
 document.getElementById("settingStatus").textContent="✓ Settings saved";
 setTimeout(()=>document.getElementById("settingStatus").textContent="",2000);
}
</script>
</body>
</html>
